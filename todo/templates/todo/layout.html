<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Letra Manuscrita -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        .firma-manuscrita {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #ffffff;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="bg-light text-secondary" style="font-family: 'Segoe UI', system-ui, sans-serif;">

<!-- Barra de navegación con tu nombre centrado -->
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-5">
        <div class="container position-relative d-flex justify-content-between align-items-center">
            
            <!-- Marca/Logo Izquierda -->
            <a class="navbar-brand fw-bold fs-4 m-0 z-1" href="{% url 'home' %}">
                <i class="fa-solid fa-check-double me-2"></i>Mis Tareas
            </a>

            <!-- Nombre Manuscrito Centrado (Bloqueado para clics para no tapar el botón) -->
            <div class="position-absolute start-50 translate-middle-x text-center pointer-events-none" style="pointer-events: none;">
                <span class="firma-manuscrita">Jesús Chagoya Pérez</span>
            </div>

            <!-- Botón Derecha -->
            <a href="{% url 'agregar' %}" class="btn btn-light text-primary fw-semibold rounded-pill px-3 shadow-sm z-1">
                <i class="fa-solid fa-plus me-1"></i> Nueva Tarea
            </a>

        </div>
    </nav>

    <!-- Contenido principal centrado -->
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
