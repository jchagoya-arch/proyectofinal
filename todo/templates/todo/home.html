{% extends 'todo/layout.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-dark m-0">Lista de tareas</h3>
    <span class="badge bg-primary rounded-pill px-3 py-2">{{ tareas|length }} pendientes</span>
</div>

{% if tareas %}
    <div class="list-group shadow-sm rounded-3 border-0">
        {% for tarea in tareas %}
        <div class="list-group-item d-flex justify-content-between align-items-center p-3 border-0 border-bottom bg-white">
            <span class="fs-6 text-dark fw-medium">{{ tarea.tarea }}</span>
            <div class="btn-group" role="group">
                <a href="{% url 'editar' tarea.id %}" class="btn btn-outline-primary btn-sm rounded-2 me-2">
                    <i class="fa-solid fa-pen me-1"></i> Editar
                </a>
                <a href="{% url 'eliminar' tarea.id %}" class="btn btn-outline-danger btn-sm rounded-2">
                    <i class="fa-solid fa-trash me-1"></i> Eliminar
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
{% else %}
    <div class="card card-body text-center py-5 border-0 shadow-sm bg-white">
        <p class="text-muted m-0">No hay tareas registradas aún.</p>
    </div>
{% endif %}
{% endblock %}
