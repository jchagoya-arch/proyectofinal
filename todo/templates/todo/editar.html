{% extends 'todo/layout.html' %}

{% block content %}
<div class="card border-0 shadow-sm rounded-3 bg-white">
    <div class="card-body p-4">
        <h4 class="fw-bold text-dark mb-4">Agregar Tarea</h4>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                {{ form.as_p }}
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'home' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn btn-primary px-4 fw-semibold">Guardar Tarea</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
